name: vikingthedev-dev

services:
  postgres:
    image: postgres:18.6-alpine
    env_file: dev.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      retries: 15

  valkey:
    image: valkey/valkey:9.1.2-alpine
    # Matches production: sessions are state, so never evict them, and persist with AOF.
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 15

volumes:
  postgres:
  valkey:
