[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only; anything else needs a decision before it lands.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies; every crate here is publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
