[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
# postgres_backend only: the pure-Rust tokio-postgres driver from diesel-async, never libpq (ADR 0005).
diesel = { version = "2.3.13", default-features = false, features = ["32-column-tables", "postgres_backend", "time", "uuid"] }
diesel-async = { version = "0.9.2", features = ["deadpool", "migrations", "postgres"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
getrandom = "0.4.3"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "serde"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
