# Checks for every PR and every push to main (M1b gate); the deploy jobs join in M1b phase 3.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      # Pushes to main, and edits to this workflow, check everything (ci-deploy.md).
      run-all: ${{ github.event_name == 'push' || steps.filter.outputs.workflow == 'true' }}
      api: ${{ steps.filter.outputs.api }}
      contract: ${{ steps.filter.outputs.contract }}
      js: ${{ steps.filter.outputs.js }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow:
              - .github/workflows/**
            api: &api
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - deny.toml
            contract:
              - crates/**
              - packages/api-types/**
            js: &js
              - apps/**
              - packages/**
              - e2e/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - eslint.config.js
              - .prettierrc.json
              - .prettierignore
              - .node-version
              # format:check runs Prettier over the whole repo, YAML included.
              - "**/*.yaml"
              - "**/*.yml"
            stack:
              - *api
              - *js
              - docker/**
              - .dockerignore
              - ci-stack/**
              - compose.ci.yaml
              - scripts/ci-stack

  rust:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: vikingthedev
          POSTGRES_DB: vikingthedev
          # Trust auth is safe only because the port is bound to the runner's loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U vikingthedev"
          --health-interval 2s
          --health-retries 15
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features api/e2e -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --features api/e2e

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  contract:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OASDIFF_VERSION: 1.33.0
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the contract and the types
        run: |
          cargo run -p openapi-gen > packages/api-types/openapi.json
          pnpm --filter @vikingthedev/api-types generate
          git diff --exit-code packages/api-types
      - run: pnpm -r check
      - name: Reject breaking API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "$OASDIFF_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" oasdiff
          git show "origin/$BASE_REF:packages/api-types/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.json" packages/api-types/openapi.json --fail-on ERR

  js:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the affected packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[origin/$BASE_REF]" check
          else
            pnpm -r check
          fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter "./apps/*" build
      - run: pnpm size
      - run: pnpm audit --prod

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned binary scans the full history; the action scans only a PR's commits.
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose

  e2e:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CI_STACK_HTTPS_PORT: 443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Playwright container runs the suite from this install (compose.ci.yaml).
      - run: pnpm install --frozen-lockfile --filter @vikingthedev/e2e
      - run: scripts/ci-stack up
      - run: scripts/ci-stack test
      - name: Resolve the stack's hosts to the published Traefik
        run: echo "127.0.0.1 vikingthe.test canary.vikingthe.test" | sudo tee --append /etc/hosts
      - name: Let Lighthouse accept the stack's self-signed certificate
        run: jq '.ci.collect.settings.chromeFlags = "--ignore-certificate-errors"' packages/config/lighthouserc.json > "$RUNNER_TEMP/lighthouserc.json"
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://vikingthe.test/
            https://vikingthe.test/account
            https://canary.vikingthe.test/
          configPath: ${{ runner.temp }}/lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
      - if: failure()
        run: docker compose --file compose.ci.yaml logs
      - if: always()
        run: scripts/ci-stack down

  # The one required check (ci-deploy.md): it always runs, so path-skipped jobs never block a merge.
  checks-passed:
    needs: [changes, rust, cargo-deny, contract, js, gitleaks, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            .changes.result == "success"
            and .["cargo-deny"].result == "success"
            and .gitleaks.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")
          ' <<<"$RESULTS"
