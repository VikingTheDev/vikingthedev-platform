# Checks for every PR and every push to main (M1b gate); pushes to main then publish and deploy the targets they change (M1b phase 3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Pushes to main, and edits to this workflow, check everything (ci-deploy.md).
      run-all: ${{ github.event_name == 'push' || steps.filter.outputs.workflow == 'true' }}
      api: ${{ steps.filter.outputs.api }}
      contract: ${{ steps.filter.outputs.contract }}
      js: ${{ steps.filter.outputs.js }}
      stack: ${{ steps.filter.outputs.stack }}
      # The targets whose image inputs differ from production, as matrix entries for publish and deploy.
      release: ${{ steps.release.outputs.targets || '[]' }}
    steps:
      # On pushes, release planning diffs against the SHA production runs, which needs history.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow:
              - .github/workflows/**
            api: &api
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - deny.toml
            contract:
              - crates/**
              - packages/api-types/**
            js: &js
              - apps/**
              - packages/**
              - e2e/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - eslint.config.js
              - .prettierrc.json
              - .prettierignore
              - .node-version
              # format:check runs Prettier over the whole repo, YAML included.
              - "**/*.yaml"
              - "**/*.yml"
            stack:
              - *api
              - *js
              - docker/**
              - .dockerignore
              - ci-stack/**
              - compose.ci.yaml
              - scripts/ci-stack
      - id: release
        if: github.event_name == 'push'
        env:
          RELEASE_ALL: ${{ steps.filter.outputs.workflow }}
        run: |
          targets="$(scripts/release plan)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: vikingthedev
          POSTGRES_DB: vikingthedev
          # Trust auth is safe only because the port is bound to the runner's loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U vikingthedev"
          --health-interval 2s
          --health-retries 15
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features api/e2e -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --features api/e2e

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  contract:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OASDIFF_VERSION: 1.33.0
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the contract and the types
        run: |
          cargo run -p openapi-gen > packages/api-types/openapi.json
          pnpm --filter @vikingthedev/api-types generate
          git diff --exit-code packages/api-types
      - run: pnpm -r check
      - name: Reject breaking API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "$OASDIFF_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" oasdiff
          git show "origin/$BASE_REF:packages/api-types/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.json" packages/api-types/openapi.json --fail-on ERR

  js:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.js == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the affected packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pnpm --filter "...[origin/$BASE_REF]" check
          else
            pnpm -r check
          fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter "./apps/*" build
      - run: pnpm size
      - run: pnpm audit --prod

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned binary scans the full history; the action scans only a PR's commits.
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose

  e2e:
    needs: changes
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CI_STACK_HTTPS_PORT: 443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Playwright container runs the suite from this install (compose.ci.yaml).
      - run: pnpm install --frozen-lockfile --filter @vikingthedev/e2e
      - run: scripts/ci-stack up
      - run: scripts/ci-stack test
      - name: Resolve the stack's hosts to the published Traefik
        run: echo "127.0.0.1 vikingthe.test canary.vikingthe.test" | sudo tee --append /etc/hosts
      - name: Let Lighthouse accept the stack's self-signed certificate
        run: jq '.ci.collect.settings.chromeFlags = "--ignore-certificate-errors"' packages/config/lighthouserc.json > "$RUNNER_TEMP/lighthouserc.json"
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://vikingthe.test/
            https://vikingthe.test/account
            https://canary.vikingthe.test/
          configPath: ${{ runner.temp }}/lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
      - if: failure()
        run: docker compose --file compose.ci.yaml logs
      - if: always()
        run: scripts/ci-stack down

  # The one required check (ci-deploy.md): it always runs, so path-skipped jobs never block a merge.
  checks-passed:
    needs: [changes, rust, cargo-deny, contract, js, gitleaks, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status '
            .changes.result == "success"
            and .["cargo-deny"].result == "success"
            and .gitleaks.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")
          ' <<<"$RESULTS"

  # Only the targets whose image inputs changed (M1b phase 3b gate); the e2e check runs before any push.
  publish:
    needs: [changes, checks-passed]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # Each target publishes on its own, so one failure never stops the others mid-build.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.release) }}
    concurrency:
      group: publish-${{ matrix.target }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/vikingthedev/vikingthedev-platform/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built into the runner first, so the e2e check runs before anything reaches the registry.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ matrix.build-arg }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Reject an API image built with the e2e test login
        if: matrix.target == 'api'
        run: |
          docker create --name api "$IMAGE:$GITHUB_SHA"
          docker cp api:/api "$RUNNER_TEMP/api"
          # grep exits 1 for no match; a match (0) or a read error (2) both fail the step.
          status=0
          grep --quiet --fixed-strings /test/login "$RUNNER_TEMP/api" || status=$?
          if [[ "$status" -ne 1 ]]; then
            echo "::error::$IMAGE:$GITHUB_SHA contains the e2e test login route, or could not be read"
            exit 1
          fi
      # Same inputs and cache as the checked build, so every layer is a cache hit.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ matrix.build-arg }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.target }}

  # Pipeline steps 2–6 of ci-deploy.md.
  deploy:
    needs: [changes, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release != '[]'
    runs-on: ubuntu-24.04
    # Room for the health wait, the smoke checks and a full rollback, each with its own bound.
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # One at a time: a redeploying API briefly 404s on /api, which would fail another target's smoke checks.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.release) }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/vikingthedev/vikingthedev-platform/${{ matrix.target }}
      HEALTH_URL: ${{ matrix.health-url }}
      PURGE_HOST: ${{ matrix.purge-host }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ready before the redeploy, so the smoke checks follow it at once.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # No cache and no install scripts: this job later runs steps with production secrets.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @vikingthedev/e2e
      - run: docker compose --file compose.ci.yaml --profile test pull playwright
      - name: Record what production runs now
        id: previous
        run: scripts/release record >> "$GITHUB_OUTPUT"
      - name: Point :prod at this build
        id: retag
        run: docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE:$GITHUB_SHA"
      # Secrets go only to the steps that use them, never to the job or a third-party action.
      - id: redeploy
        env:
          WEBHOOK: ${{ secrets[matrix.webhook] }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: scripts/release redeploy
      - id: wait
        run: scripts/release wait-for "$GITHUB_SHA"
      - if: matrix.purge-host != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/release purge
      # Runs even after a failed purge: stale cached HTML can point at assets the new image lacks.
      # The repo is mounted read-only in the Playwright container, so the tests can't alter the rollback's scripts.
      - id: smoke
        if: ${{ !cancelled() && steps.wait.outcome == 'success' }}
        timeout-minutes: 6
        env:
          PLATFORM_DOMAIN: vikingthe.dev
        run: scripts/ci-stack smoke
      # A failed redeploy, health wait or smoke check rolls back (ci-deploy.md, ADR 0008); a failed purge alone doesn't.
      - name: Roll back to the recorded digest
        if: >-
          (failure() || cancelled())
          && steps.retag.outcome == 'success'
          && (steps.redeploy.outcome != 'success' || steps.wait.outcome != 'success' || steps.smoke.outcome == 'failure' || steps.smoke.outcome == 'cancelled')
          && steps.previous.outputs.digest != ''
        env:
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
          WEBHOOK: ${{ secrets[matrix.webhook] }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE@$PREVIOUS_DIGEST"
          scripts/release redeploy
          waited=0
          if [[ -n "$PREVIOUS_SHA" ]]; then scripts/release wait-for "$PREVIOUS_SHA" || waited=$?; fi
          if [[ -n "$PURGE_HOST" ]]; then scripts/release purge; fi
          exit "$waited"

  # Lab timings from a runner are noisy, so a budget miss turns the run red but never rolls back (ADR 0008).
  lighthouse-production:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://vikingthe.dev/
            https://vikingthe.dev/account
            https://canary.vikingthe.dev/
          configPath: packages/config/lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
